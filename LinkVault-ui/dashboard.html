<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkVault - Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../styles/dashboard-styles.css" />
  </head>
  <body>
    <div class="navbar">
      <div class="navbar-left">
        <img src="../images/logo.png" alt="LinkVault_logo" />
        <h1>Dashboard</h1>

        <div class="search-container">
          <input
            type="text"
            id="search-bar"
            placeholder="Search bookmarks..."
            oninput="filterBookmarks()"
          />
        </div>
      </div>
      <button id="add-bookmark" onclick="addBookmark()">Add Bookmark</button>
    </div>

    <div class="bookmarks" id="bookmarks-container"></div>
    <button type="button" class="logout-btn" onclick="logout()">Logout</button>

    <script src="../script/dashboard.js"></script>
  </body>
</html>
