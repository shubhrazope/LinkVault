<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login/Signup page</title>
    <link rel="stylesheet" href="../styles/login-styles.css" />
  </head>
  <body>
    <div>
      <img src="../images/logo.png" alt="LinkVault_logo" />
      <form>
        <input
          type="text"
          name="username"
          placeholder="Username"
          id="username"
          class="form-input"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          id="password"
          class="form-input"
          required
        />
        <button type="button" onclick="login()" id="login-btn" class="btn">
          Login
        </button>
        <button type="button" onclick="signup()" id="signup-btn" class="btn">
          Signup
        </button>
      </form>
    </div>

    <script src="../script/login.js"></script>
  </body>
</html>
